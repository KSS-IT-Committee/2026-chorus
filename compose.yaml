services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: 2026-chorus
      POSTGRES_PASSWORD: 2026-chorus
      POSTGRES_DB: 2026-chorus

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 2026-chorus -d 2026-chorus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: