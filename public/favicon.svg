    <g fill="none" stroke="#FFD84D" stroke-width="10"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 53 L61 100"/>
      <path d="M128 53 L195 100"/>
      <path d="M88 111 H168"/>
    </g>

    <!-- 5つのきらめき -->
    <g fill="#FFD84D">
      <path transform="translate(128 53) scale(1.35) translate(-128 -53)"
        d="M128 42 C130 49 132 51 139 53 C132 55 130 57 128 64 C126 57 124 55 117 53 C124 51 126 49 128 42Z"/>
      <path transform="translate(61 100) scale(1.35) translate(-61 -100)"
        d="M61 90 C63 96 65 98 71 100 C65 102 63 104 61 110 C59 104 57 102 51 100 C57 98 59 96 61 90Z"/>
      <path transform="translate(195 100) scale(1.35) translate(-195 -100)"
        d="M195 90 C197 96 199 98 205 100 C199 102 197 104 195 110 C193 104 191 102 185 100 C191 98 193 96 195 90Z"/>
      <path transform="translate(88 111) scale(1.35) translate(-88 -111)"
        d="M88 101 C90 107 92 109 98 111 C92 113 90 115 88 121 C86 115 84 113 78 111 C84 109 86 107 88 101Z"/>
      <path transform="translate(168 111) scale(1.35) translate(-168 -111)"
        d="M168 101 C170 107 172 109 178 111 C172 113 170 115 168 121 C166 115 164 113 158 111 C164 109 166 107 168 101Z"/>
    </g>

    <!-- 付点8分音符＋16分音符 -->
