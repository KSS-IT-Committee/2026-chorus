       fill="#FFD84D" stroke="#FFD84D"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- 楕円だけ小さく -->
      <ellipse cx="76" cy="190" rx="13.5" ry="8.5"
        transform="rotate(-25 76 190)"/>
      <ellipse cx="158" cy="190" rx="13.5" ry="8.5"
        transform="rotate(-25 158 190)"/>

      <path d="M90 187 V130" fill="none" stroke-width="7"/>
      <path d="M172 187 V130" fill="none" stroke-width="7"/>

      <path d="M90 130 H172 V140 H90 Z"/>
      <!-- 16分音符側の補助連桁を少し長く、太く -->
      <path d="M120 170 H172 V158 H120 Z"/>
    </g>

    <!-- 付点の星 -->
    <path fill="#FFD84D"
      transform="translate(108 169) scale(1.5) translate(-116 -187)"
      d="M116 177 C118 183 120 185 126 187 C120 189 118 191 116 197 C114 191 112 189 106 187 C112 185 114 183 116 177Z"/>
  </g>
